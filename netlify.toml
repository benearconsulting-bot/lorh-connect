# netlify.toml — Configuration Netlify pour LORH Connect

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirections
[[redirects]]
  from = "/devis"
  to = "/pages/devis.html"
  status = 301

[[redirects]]
  from = "/transport"
  to = "/pages/transport.html"
  status = 301

[[redirects]]
  from = "/automobile"
  to = "/pages/automobile.html"
  status = 301

[[redirects]]
  from = "/pieces"
  to = "/pages/pieces.html"
  status = 301

[[redirects]]
  from = "/import-export"
  to = "/pages/import-export.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 301

# Formulaires Netlify — notifications email
# Configurer dans Dashboard Netlify > Forms > Notifications
